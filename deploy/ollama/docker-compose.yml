services:
  ollama:
    image: ollama/ollama:latest
    container_name: family-messenger-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  model-init:
    image: ollama/ollama:latest
    container_name: family-messenger-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull qwen3:4b"]
    restart: "no"

volumes:
  ollama-data:
