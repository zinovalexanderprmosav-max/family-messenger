services:
  - type: web
    name: family-messenger
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 0.5.1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: DATABASE_URL
        fromDatabase:
          name: family-messenger-db
          property: connectionString

databases:
  - name: family-messenger-db
    databaseName: family
    user: family
    ipAllowList: []
