services:
  - type: web
    name: family-messenger
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 0.4.2
      - key: DATABASE_URL
        fromDatabase:
          name: family-messenger-db
          property: connectionString

databases:
  - name: family-messenger-db
    databaseName: family
    user: family
    ipAllowList: []
