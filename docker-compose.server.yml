services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: family
    volumes:
      - family_server_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U family -d family"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_VERSION: 0.3.8-rc1
      PORT: 10000
      DATABASE_URL: postgres://family:${POSTGRES_PASSWORD}@db:5432/family
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "10000"

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Server.Caddyfile:/etc/caddy/Caddyfile:ro
      - family_caddy_data:/data
      - family_caddy_config:/config
    depends_on:
      - app

volumes:
  family_server_db:
  family_caddy_data:
  family_caddy_config:
