plugins {
    id 'com.android.application'
}

def configuredUrl = providers.gradleProperty("familyMessengerUrl").orElse("").get()
def escapedUrl = configuredUrl.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace 'com.zialex.familymessenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zialex.familymessenger'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.7'
        buildConfigField 'String', 'DEFAULT_START_URL', '"' + escapedUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
}
