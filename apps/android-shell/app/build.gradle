plugins {
    id "com.android.application"
}

android {
    namespace "com.familymessenger.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.familymessenger.app"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "0.4.0-final"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
