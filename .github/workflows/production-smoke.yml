name: Release Production Smoke

on:
  push:
    branches:
      - release/0.3.8-rc1
  pull_request:
    branches:
      - feat/phase3c8-production-deploy

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family-dev-only
          POSTGRES_DB: family
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U family -d family"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t family-messenger:rc1 .
      - name: Start production image
        run: |
          docker run -d --name family-messenger-rc1 --network host \
            -e PORT=10000 \
            -e NODE_ENV=production \
            -e APP_VERSION=0.3.8-rc1 \
            -e DATABASE_URL=postgres://family:family-dev-only@127.0.0.1:5432/family \
            family-messenger:rc1
      - name: Verify health and release version
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health | grep -q '"status":"ok"' \
              && curl --fail --silent http://127.0.0.1:10000/v1/about | grep -q '"version":"0.3.8-rc1"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs family-messenger-rc1
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f family-messenger-rc1 || true
