name: Release RC CI

on:
  push:
    branches:
      - release/0.3.8-rc1
  pull_request:
    branches:
      - feat/phase3c8-production-deploy
      - main

jobs:
  full-project:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family-dev-only
          POSTGRES_DB: family
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U family -d family"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://family:family-dev-only@127.0.0.1:5432/family
      TEST_DATABASE_URL: postgres://family:family-dev-only@127.0.0.1:5432/family
      NODE_ENV: test
      APP_VERSION: 0.3.8-rc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -w apps/server -- --run
      - run: npm test -w apps/web -- --run
      - run: npm test -w packages/crypto -- --run --passWithNoTests
      - run: npm test -w packages/protocol -- --run --passWithNoTests
      - run: npm run build
      - name: Package iPhone PWA build
        run: |
          mkdir -p artifacts/iphone-pwa
          cp -R apps/web/dist/. artifacts/iphone-pwa/
          (cd artifacts && zip -r FamilyMessenger-0.3.8-rc1-iPhone-PWA.zip iphone-pwa)
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyMessenger-0.3.8-rc1-iPhone-PWA
          path: artifacts/FamilyMessenger-0.3.8-rc1-iPhone-PWA.zip
          if-no-files-found: error
