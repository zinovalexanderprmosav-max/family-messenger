name: Phase 3C8 CI

on:
  push:
    branches:
      - feat/phase3c2-removal-revocation
      - feat/phase3c3-own-device-enrollment
      - feat/phase3c4-trusted-key-provisioning
      - feat/phase3c5-device-member-management
      - feat/phase3c6-e2ee-attachments
      - feat/phase3c7-android-apk-pwa-release
      - feat/phase3c7-android-apk-pwa-release
      - feat/phase3c8-production-deploy
  pull_request:
    branches:
      - main
      - feat/phase3c2-removal-revocation
      - feat/phase3c3-own-device-enrollment
      - feat/phase3c4-trusted-key-provisioning
      - feat/phase3c5-device-member-management
      - feat/phase3c6-e2ee-attachments

jobs:
  full-project:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family-dev-only
          POSTGRES_DB: family
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U family -d family"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://family:family-dev-only@127.0.0.1:5432/family
      TEST_DATABASE_URL: postgres://family:family-dev-only@127.0.0.1:5432/family
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -w apps/server -- --run
      - run: npm test -w apps/web -- --run
      - run: npm test -w packages/crypto -- --run --passWithNoTests
      - run: npm test -w packages/protocol -- --run --passWithNoTests
      - run: npm run build
