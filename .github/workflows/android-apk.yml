name: Android APK

on:
  push:
    branches:
      - feat/phase3c7-pwa-android-apk
  pull_request:
    branches:
      - feat/phase3c6-e2ee-attachments
  workflow_dispatch:
    inputs:
      start_url:
        description: "Optional default HTTPS Family Messenger URL"
        required: false
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      FAMILY_URL: ${{ inputs.start_url || vars.FAMILY_MESSENGER_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug -PfamilyMessengerUrl="$FAMILY_URL" --stacktrace

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FamilyMessenger-debug.apk
          sha256sum FamilyMessenger-debug.apk | tee FamilyMessenger-debug.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyMessenger-debug-apk
          path: |
            FamilyMessenger-debug.apk
            FamilyMessenger-debug.sha256
          if-no-files-found: error
          retention-days: 30
