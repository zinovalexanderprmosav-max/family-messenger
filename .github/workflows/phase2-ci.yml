name: Phase 2 CI

on:
  push:
    branches:
      - feat/phase2-offline-dark-theme
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
