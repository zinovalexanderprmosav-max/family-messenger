name: Phase 2 CI

on:
  push:
    branches:
      - feat/phase2-offline-dark-theme
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test web
        run: npm run test -w apps/web -- --run

      - name: Test server
        run: npm run test -w apps/server -- --run --passWithNoTests

      - name: Test crypto
        run: npm run test -w packages/crypto -- --run --passWithNoTests

      - name: Test protocol
        run: npm run test -w packages/protocol -- --run --passWithNoTests

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
